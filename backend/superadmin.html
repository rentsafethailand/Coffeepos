<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Super Admin - Coffee Shop POS</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Alpine.js -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

  <!-- Google Fonts - Sarabun -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      font-family: 'Sarabun', sans-serif;
    }

    .gradient-bg {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }

    .gradient-purple-pink {
      background: linear-gradient(135deg, #8B5CF6 0%, #EC4899 100%);
    }

    .card-hover {
      transition: all 0.3s ease;
    }

    .card-hover:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(139, 92, 246, 0.3);
    }

    .badge {
      padding: 4px 12px;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .badge-success { background: #10B981; color: white; }
    .badge-warning { background: #F59E0B; color: white; }
    .badge-danger { background: #EF4444; color: white; }
    .badge-info { background: #3B82F6; color: white; }

    .modal-backdrop {
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(4px);
    }
  </style>
</head>

<body class="bg-gray-50" x-data="superAdminApp()" x-init="init()">

  <!-- Top Navigation -->
  <nav class="gradient-purple-pink text-white shadow-lg">
    <div class="px-6 py-4">
      <div class="flex items-center justify-between">
        <div class="flex items-center space-x-4">
          <div class="bg-white/20 rounded-lg p-2">
            <svg class="w-8 h-8" fill="currentColor" viewBox="0 0 24 24">
              <path d="M12,15.5A3.5,3.5 0 0,1 8.5,12A3.5,3.5 0 0,1 12,8.5A3.5,3.5 0 0,1 15.5,12A3.5,3.5 0 0,1 12,15.5M19.43,12.97C19.47,12.65 19.5,12.33 19.5,12C19.5,11.67 19.47,11.34 19.43,11L21.54,9.37C21.73,9.22 21.78,8.95 21.66,8.73L19.66,5.27C19.54,5.05 19.27,4.96 19.05,5.05L16.56,6.05C16.04,5.66 15.5,5.32 14.87,5.07L14.5,2.42C14.46,2.18 14.25,2 14,2H10C9.75,2 9.54,2.18 9.5,2.42L9.13,5.07C8.5,5.32 7.96,5.66 7.44,6.05L4.95,5.05C4.73,4.96 4.46,5.05 4.34,5.27L2.34,8.73C2.21,8.95 2.27,9.22 2.46,9.37L4.57,11C4.53,11.34 4.5,11.67 4.5,12C4.5,12.33 4.53,12.65 4.57,12.97L2.46,14.63C2.27,14.78 2.21,15.05 2.34,15.27L4.34,18.73C4.46,18.95 4.73,19.03 4.95,18.95L7.44,17.94C7.96,18.34 8.5,18.68 9.13,18.93L9.5,21.58C9.54,21.82 9.75,22 10,22H14C14.25,22 14.46,21.82 14.5,21.58L14.87,18.93C15.5,18.67 16.04,18.34 16.56,17.94L19.05,18.95C19.27,19.03 19.54,18.95 19.66,18.73L21.66,15.27C21.78,15.05 21.73,14.78 21.54,14.63L19.43,12.97Z" />
            </svg>
          </div>
          <div>
            <h1 class="text-xl font-bold">Super Admin Panel</h1>
            <p class="text-sm text-white/80">Multi-tenant Management System</p>
          </div>
        </div>

        <div class="flex items-center space-x-4">
          <span class="text-sm" x-text="currentDateTime"></span>
          <button @click="logout()" class="px-4 py-2 bg-white/20 hover:bg-white/30 rounded-lg transition">
            <svg class="w-5 h-5 inline mr-2" fill="currentColor" viewBox="0 0 24 24">
              <path d="M16,17V14H9V10H16V7L21,12L16,17M14,2A2,2 0 0,1 16,4V6H14V4H5V20H14V18H16V20A2,2 0 0,1 14,22H5A2,2 0 0,1 3,20V4A2,2 0 0,1 5,2H14Z" />
            </svg>
            ออกจากระบบ
          </button>
        </div>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <div class="container mx-auto px-6 py-8">

    <!-- Stats Overview -->
    <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">

      <!-- Total Tenants -->
      <div class="bg-white rounded-xl shadow-md p-6 card-hover">
        <div class="flex items-center justify-between mb-4">
          <div class="bg-blue-100 rounded-lg p-3">
            <svg class="w-6 h-6 text-blue-600" fill="currentColor" viewBox="0 0 24 24">
              <path d="M12,5.5A3.5,3.5 0 0,1 15.5,9A3.5,3.5 0 0,1 12,12.5A3.5,3.5 0 0,1 8.5,9A3.5,3.5 0 0,1 12,5.5M5,8C5.56,8 6.08,8.15 6.53,8.42C6.38,9.85 6.8,11.27 7.66,12.38C7.16,13.34 6.16,14 5,14A3,3 0 0,1 2,11A3,3 0 0,1 5,8M19,8A3,3 0 0,1 22,11A3,3 0 0,1 19,14C17.84,14 16.84,13.34 16.34,12.38C17.2,11.27 17.62,9.85 17.47,8.42C17.92,8.15 18.44,8 19,8M5.5,18.25C5.5,16.18 8.41,14.5 12,14.5C15.59,14.5 18.5,16.18 18.5,18.25V20H5.5V18.25M0,20V18.5C0,17.11 1.89,15.94 4.45,15.6C3.86,16.28 3.5,17.22 3.5,18.25V20H0M24,20H20.5V18.25C20.5,17.22 20.14,16.28 19.55,15.6C22.11,15.94 24,17.11 24,18.5V20Z" />
            </svg>
          </div>
        </div>
        <p class="text-gray-500 text-sm mb-1">ร้านค้าทั้งหมด</p>
        <h3 class="text-3xl font-bold text-gray-800" x-text="stats.totalTenants"></h3>
      </div>

      <!-- Active Tenants -->
      <div class="bg-white rounded-xl shadow-md p-6 card-hover">
        <div class="flex items-center justify-between mb-4">
          <div class="bg-green-100 rounded-lg p-3">
            <svg class="w-6 h-6 text-green-600" fill="currentColor" viewBox="0 0 24 24">
              <path d="M21,7L9,19L3.5,13.5L4.91,12.09L9,16.17L19.59,5.59L21,7Z" />
            </svg>
          </div>
        </div>
        <p class="text-gray-500 text-sm mb-1">เปิดใช้งาน</p>
        <h3 class="text-3xl font-bold text-green-600" x-text="stats.activeTenants"></h3>
      </div>

      <!-- Total Revenue -->
      <div class="bg-white rounded-xl shadow-md p-6 card-hover">
        <div class="flex items-center justify-between mb-4">
          <div class="bg-purple-100 rounded-lg p-3">
            <svg class="w-6 h-6 text-purple-600" fill="currentColor" viewBox="0 0 24 24">
              <path d="M3,6H21V18H3V6M12,9A3,3 0 0,1 15,12A3,3 0 0,1 12,15A3,3 0 0,1 9,12A3,3 0 0,1 12,9M7,8A2,2 0 0,1 5,10V14A2,2 0 0,1 7,16H17A2,2 0 0,1 19,14V10A2,2 0 0,1 17,8H7Z" />
            </svg>
          </div>
        </div>
        <p class="text-gray-500 text-sm mb-1">รายได้รวม (เดือนนี้)</p>
        <h3 class="text-3xl font-bold text-purple-600" x-text="formatCurrency(stats.totalRevenue)"></h3>
      </div>

      <!-- Total Orders -->
      <div class="bg-white rounded-xl shadow-md p-6 card-hover">
        <div class="flex items-center justify-between mb-4">
          <div class="bg-orange-100 rounded-lg p-3">
            <svg class="w-6 h-6 text-orange-600" fill="currentColor" viewBox="0 0 24 24">
              <path d="M19,20H5V9H19M16,2H8C6.9,2 6,2.9 6,4V8H18V4C18,2.9 17.1,2 16,2M20,10H4C2.9,10 2,10.9 2,12V20C2,21.1 2.9,22 4,22H20C21.1,22 22,21.1 22,20V12C22,10.9 21.1,10 20,10Z" />
            </svg>
          </div>
        </div>
        <p class="text-gray-500 text-sm mb-1">ออเดอร์ทั้งหมด (เดือนนี้)</p>
        <h3 class="text-3xl font-bold text-orange-600" x-text="stats.totalOrders"></h3>
      </div>

    </div>

    <!-- Actions Bar -->
    <div class="flex justify-between items-center mb-6">
      <h2 class="text-2xl font-bold text-gray-800">รายการร้านค้า</h2>
      <button @click="openCreateTenantModal()" class="px-6 py-3 gradient-purple-pink text-white font-semibold rounded-lg hover:shadow-lg transition">
        <svg class="w-5 h-5 inline mr-2" fill="currentColor" viewBox="0 0 24 24">
          <path d="M19,13H13V19H11V13H5V11H11V5H13V11H19V13Z" />
        </svg>
        เพิ่มร้านค้าใหม่
      </button>
    </div>

    <!-- Tenants Table -->
    <div class="bg-white rounded-xl shadow-md overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full">
          <thead class="gradient-purple-pink text-white">
            <tr>
              <th class="px-6 py-3 text-left text-sm font-semibold">Tenant ID</th>
              <th class="px-6 py-3 text-left text-sm font-semibold">ชื่อร้าน</th>
              <th class="px-6 py-3 text-left text-sm font-semibold">ผู้ติดต่อ</th>
              <th class="px-6 py-3 text-left text-sm font-semibold">เบอร์โทร</th>
              <th class="px-6 py-3 text-center text-sm font-semibold">สถานะ</th>
              <th class="px-6 py-3 text-center text-sm font-semibold">วันที่สร้าง</th>
              <th class="px-6 py-3 text-center text-sm font-semibold">การกระทำ</th>
            </tr>
          </thead>
          <tbody class="divide-y divide-gray-200">
            <template x-for="tenant in tenants" :key="tenant.id">
              <tr class="hover:bg-purple-50 transition">
                <td class="px-6 py-4 text-sm font-mono text-purple-600" x-text="tenant.id"></td>
                <td class="px-6 py-4">
                  <div>
                    <p class="font-semibold text-gray-800" x-text="tenant.name"></p>
                    <p class="text-xs text-gray-500" x-text="tenant.address"></p>
                  </div>
                </td>
                <td class="px-6 py-4 text-sm text-gray-600" x-text="tenant.contactName"></td>
                <td class="px-6 py-4 text-sm text-gray-600" x-text="tenant.phone"></td>
                <td class="px-6 py-4 text-center">
                  <span :class="tenant.isActive ? 'badge-success' : 'badge-danger'" class="badge" x-text="tenant.isActive ? 'เปิดใช้งาน' : 'ปิดใช้งาน'"></span>
                </td>
                <td class="px-6 py-4 text-sm text-gray-600 text-center" x-text="formatDate(tenant.createdAt)"></td>
                <td class="px-6 py-4 text-center">
                  <div class="flex items-center justify-center space-x-2">
                    <button @click="viewTenant(tenant)" class="text-blue-600 hover:text-blue-800 font-semibold text-sm">
                      ดู
                    </button>
                    <button @click="toggleTenantStatus(tenant)" class="text-orange-600 hover:text-orange-800 font-semibold text-sm" x-text="tenant.isActive ? 'ปิด' : 'เปิด'">
                    </button>
                  </div>
                </td>
              </tr>
            </template>
          </tbody>
        </table>

        <div x-show="tenants.length === 0" class="text-center py-12 text-gray-400">
          <svg class="w-20 h-20 mx-auto mb-4" fill="currentColor" viewBox="0 0 24 24">
            <path d="M12,5.5A3.5,3.5 0 0,1 15.5,9A3.5,3.5 0 0,1 12,12.5A3.5,3.5 0 0,1 8.5,9A3.5,3.5 0 0,1 12,5.5M5,8C5.56,8 6.08,8.15 6.53,8.42C6.38,9.85 6.8,11.27 7.66,12.38C7.16,13.34 6.16,14 5,14A3,3 0 0,1 2,11A3,3 0 0,1 5,8M19,8A3,3 0 0,1 22,11A3,3 0 0,1 19,14C17.84,14 16.84,13.34 16.34,12.38C17.2,11.27 17.62,9.85 17.47,8.42C17.92,8.15 18.44,8 19,8M5.5,18.25C5.5,16.18 8.41,14.5 12,14.5C15.59,14.5 18.5,16.18 18.5,18.25V20H5.5V18.25M0,20V18.5C0,17.11 1.89,15.94 4.45,15.6C3.86,16.28 3.5,17.22 3.5,18.25V20H0M24,20H20.5V18.25C20.5,17.22 20.14,16.28 19.55,15.6C22.11,15.94 24,17.11 24,18.5V20Z" />
          </svg>
          <p>ยังไม่มีร้านค้า</p>
        </div>
      </div>
    </div>

  </div>

  <!-- Create Tenant Modal -->
  <div x-show="modals.createTenant"
       x-cloak
       class="fixed inset-0 z-50 flex items-center justify-center modal-backdrop"
       @click.self="modals.createTenant = false">
    <div class="bg-white rounded-2xl shadow-2xl max-w-2xl w-full mx-4 max-h-[90vh] overflow-y-auto">
      <div class="p-6">
        <h3 class="text-2xl font-bold text-gray-800 mb-6">เพิ่มร้านค้าใหม่</h3>

        <form @submit.prevent="createTenant()" class="space-y-4">

          <!-- Shop Name -->
          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-2">ชื่อร้าน *</label>
            <input type="text" x-model="newTenant.name" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500">
          </div>

          <!-- Contact Name -->
          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-2">ชื่อผู้ติดต่อ *</label>
            <input type="text" x-model="newTenant.contactName" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500">
          </div>

          <!-- Phone -->
          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-2">เบอร์โทรศัพท์ *</label>
            <input type="tel" x-model="newTenant.phone" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500">
          </div>

          <!-- Email -->
          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-2">อีเมล *</label>
            <input type="email" x-model="newTenant.email" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500">
          </div>

          <!-- Address -->
          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-2">ที่อยู่</label>
            <textarea x-model="newTenant.address" rows="3" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500"></textarea>
          </div>

          <!-- Admin Username -->
          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-2">ชื่อผู้ใช้ Admin *</label>
            <input type="text" x-model="newTenant.adminUsername" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500">
          </div>

          <!-- Admin Password -->
          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-2">รหัสผ่าน Admin *</label>
            <input type="password" x-model="newTenant.adminPassword" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500">
          </div>

          <!-- Actions -->
          <div class="flex space-x-3 pt-4">
            <button type="button" @click="modals.createTenant = false" class="flex-1 px-6 py-3 border-2 border-gray-300 text-gray-700 font-semibold rounded-lg hover:bg-gray-50 transition">
              ยกเลิก
            </button>
            <button type="submit" class="flex-1 px-6 py-3 gradient-purple-pink text-white font-semibold rounded-lg hover:shadow-lg transition">
              สร้างร้านค้า
            </button>
          </div>

        </form>
      </div>
    </div>
  </div>

  <!-- Alpine.js App -->
  <script>
    function superAdminApp() {
      return {
        currentDateTime: '',

        stats: {
          totalTenants: 0,
          activeTenants: 0,
          totalRevenue: 0,
          totalOrders: 0
        },

        tenants: [],

        modals: {
          createTenant: false
        },

        newTenant: {
          name: '',
          contactName: '',
          phone: '',
          email: '',
          address: '',
          adminUsername: '',
          adminPassword: ''
        },

        API_URL: 'YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL_HERE',

        init() {
          this.updateDateTime();
          setInterval(() => this.updateDateTime(), 1000);
          this.loadData();
        },

        updateDateTime() {
          const now = new Date();
          const options = {
            year: 'numeric',
            month: 'long',
            day: 'numeric',
            hour: '2-digit',
            minute: '2-digit',
            second: '2-digit'
          };
          this.currentDateTime = now.toLocaleDateString('th-TH', options);
        },

        async loadData() {
          try {
            // Load tenants
            const response = await this.callAPI('getTenants', {});

            if (response.success) {
              this.tenants = response.data.tenants || [];
              this.stats = response.data.stats || this.stats;
            }
          } catch (error) {
            console.error('Error loading data:', error);
            // Use mock data for demo
            this.loadMockData();
          }
        },

        loadMockData() {
          this.tenants = [
            {
              id: 'TENANT_001',
              name: 'Coffee House สาขาสยาม',
              contactName: 'สมชาย ใจดี',
              phone: '02-123-4567',
              email: 'siam@coffeehouse.com',
              address: 'สยามสแควร์ กรุงเทพฯ',
              isActive: true,
              createdAt: '2024-01-15'
            },
            {
              id: 'TENANT_002',
              name: 'Café Smile สาขาอารีย์',
              contactName: 'สมหญิง รักษ์ดี',
              phone: '02-987-6543',
              email: 'ari@cafesmile.com',
              address: 'ถนนพหลโยธิน อารีย์ กทม.',
              isActive: true,
              createdAt: '2024-02-01'
            },
            {
              id: 'TENANT_003',
              name: 'Morning Brew เชียงใหม่',
              contactName: 'ประยุทธ์ สุขใจ',
              phone: '053-123-456',
              email: 'cm@morningbrew.com',
              address: 'นิมมานเหมินทร์ เชียงใหม่',
              isActive: false,
              createdAt: '2024-01-20'
            }
          ];

          this.stats = {
            totalTenants: 3,
            activeTenants: 2,
            totalRevenue: 456700,
            totalOrders: 1245
          };
        },

        openCreateTenantModal() {
          this.newTenant = {
            name: '',
            contactName: '',
            phone: '',
            email: '',
            address: '',
            adminUsername: '',
            adminPassword: ''
          };
          this.modals.createTenant = true;
        },

        async createTenant() {
          try {
            const response = await this.callAPI('createTenant', this.newTenant);

            if (response.success) {
              alert('สร้างร้านค้าสำเร็จ!\nTenant ID: ' + response.data.tenantId);
              this.modals.createTenant = false;
              this.loadData();
            } else {
              alert('เกิดข้อผิดพลาด: ' + response.message);
            }
          } catch (error) {
            console.error('Error creating tenant:', error);
            alert('เกิดข้อผิดพลาดในการสร้างร้านค้า');
          }
        },

        viewTenant(tenant) {
          alert('ดูรายละเอียดร้าน: ' + tenant.name + '\nTenant ID: ' + tenant.id);
        },

        async toggleTenantStatus(tenant) {
          const action = tenant.isActive ? 'ปิดใช้งาน' : 'เปิดใช้งาน';
          if (!confirm('ต้องการ' + action + 'ร้าน ' + tenant.name + ' ใช่หรือไม่?')) {
            return;
          }

          try {
            const response = await this.callAPI('toggleTenantStatus', {
              tenantId: tenant.id,
              isActive: !tenant.isActive
            });

            if (response.success) {
              tenant.isActive = !tenant.isActive;
              alert(action + 'สำเร็จ');
            }
          } catch (error) {
            console.error('Error toggling status:', error);
            alert('เกิดข้อผิดพลาด');
          }
        },

        logout() {
          if (confirm('ต้องการออกจากระบบใช่หรือไม่?')) {
            window.location.href = 'index.html';
          }
        },

        formatCurrency(amount) {
          return new Intl.NumberFormat('th-TH', {
            style: 'currency',
            currency: 'THB'
          }).format(amount || 0);
        },

        formatDate(dateString) {
          if (!dateString) return '';
          const date = new Date(dateString);
          return date.toLocaleDateString('th-TH', {
            year: 'numeric',
            month: 'short',
            day: 'numeric'
          });
        },

        async callAPI(action, params) {
          // Mock API for demo
          console.log('API Call:', action, params);

          return new Promise((resolve) => {
            setTimeout(() => {
              if (action === 'createTenant') {
                resolve({
                  success: true,
                  data: {
                    tenantId: 'TENANT_' + Date.now()
                  }
                });
              } else {
                resolve({
                  success: false,
                  message: 'API not configured'
                });
              }
            }, 500);
          });
        }
      };
    }
  </script>
